<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Gurman Kaur | Portfolio Hero</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Using Bodoni Moda for that high-end, high-contrast serif look -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Inter:wght@300;400&amp;display=swap" rel="stylesheet">
<style data-purpose="typography">
    :root {
      --font-serif: "Bodoni Moda", serif;
      --font-sans: "Inter", sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Minimalist full-screen feel */
    }

    .hero-text {
      font-family: var(--font-serif);
      /* Custom tracking for that sophisticated editorial look */
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .vertical-text {
      writing-mode: vertical-rl;
      font-family: var(--font-sans);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.7rem;
    }

    .webflow-logo {
      font-family: var(--font-sans);
      font-weight: 900;
      font-size: 1.5rem;
    }
  </style>
<style data-purpose="layout">
    /* Custom spacing and positioning helpers */
    .hero-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .badge-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
    }
  </style>
</head>
<body class="bg-black text-white antialiased">
<!-- BEGIN: HeroSection -->
<main class="hero-container px-6 md:px-12" data-purpose="hero-section">

<h1 class="hero-text text-6xl md:text-8xl lg:text-9xl font-normal leading-none">
        Gurman
      </h1>
<h1 class="hero-text text-6xl md:text-8xl lg:text-9xl font-normal leading-none">
        Kaur
      </h1>
</section>
