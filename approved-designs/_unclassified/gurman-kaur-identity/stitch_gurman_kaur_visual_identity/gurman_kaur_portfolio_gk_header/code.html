<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Minimalist Portfolio Hero</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for High-Contrast Serif -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;display=swap" rel="stylesheet">
<style data-purpose="typography">
    /* Applying Bodoni Moda for that high-fashion, high-contrast serif look seen in the reference */
    .font-serif-elegant {
      font-family: 'Bodoni Moda', serif;
      letter-spacing: -0.02em;
    }
  </style>
<style data-purpose="layout-optimizations">
    /* Ensuring the background is a true, deep black */
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Minimalist landing often restricts scrolling if single-screen */
    }

    /* Subtle animation for a premium feel */
    .fade-in-up {
      animation: fadeInUp 1.5s cubic-bezier(0.21, 0.6, 0.35, 1) forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-black text-white antialiased">
<!-- BEGIN: HeroSection -->
<main class="min-h-screen w-full flex items-center justify-center p-6" data-purpose="hero-container" id="hero">
<!-- Centered Content Wrapper -->
<div class="text-center select-none">
<!-- Primary Brand Initials -->
<h1 class="font-serif-elegant text-[12rem] md:text-[18rem] lg:text-[22rem] leading-none text-white fade-in-up" data-purpose="brand-initials">
        GK
      </h1>
<!-- BEGIN: SubtleNavigation (Optional for portfolio context) -->

<!-- END: SubtleNavigation -->
</div>
</main>
<!-- END: HeroSection -->
<!-- BEGIN: Footer -->

<!-- END: Footer -->
<!-- BEGIN: InteractionScript -->
<script data-purpose="cursor-tracking">
    // Optional subtle parallax effect or interaction could go here
    // Keeping it clean and functional for a minimalist look
  </script>
<!-- END: InteractionScript -->
</body></html>
