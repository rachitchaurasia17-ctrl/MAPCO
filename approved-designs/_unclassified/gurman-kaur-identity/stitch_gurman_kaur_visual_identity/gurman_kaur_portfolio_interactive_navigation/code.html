<script>
        // Tab switching logic (visual only for now)
        const tabs = document.querySelectorAll('.font-inter button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active-tab', 'text-white'));
                tabs.forEach(t => t.classList.add('text-secondary-fixed-dim'));
                tab.classList.add('active-tab', 'text-white');
                tab.classList.remove('text-secondary-fixed-dim');
            });
        });
