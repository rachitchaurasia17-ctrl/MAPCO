            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom scrollbar for minimalist look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #333333;
        }

        .bw-filter {
            filter: grayscale(0%) contrast(100%);
            transition: filter 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card-container:hover .bw-filter,
        .card-container:active .bw-filter {
            filter: grayscale(100%) contrast(110%);
        }

        .reveal-text {
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card-container:hover .reveal-text {
            transform: translateY(0);
            opacity: 1;
        }

<script>
        // Micro-interactions for smooth page transitions
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.card-container');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => {
                            entry.target.classList.add('opacity-100');
                            entry.target.classList.remove('opacity-0');
                        }, index * 100);
                    }
                });
            }, { threshold: 0.1 });

            cards.forEach(card => {
                card.classList.add('opacity-0', 'transition-opacity', 'duration-1000');
                observer.observe(card);
            });
        });
    </script>
